name: Supabase keepalive & backup

# Supabase Free は7日間アクセスがないと一時停止するため、毎日1回クエリを投げる。
# あわせて pg_dump を取り、Actions Artifacts に90日保存する。
on:
  schedule:
    - cron: "17 21 * * *" # 毎日 06:17 JST
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping (REST)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/site_settings?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
          echo "ping ok"

  backup:
    runs-on: ubuntu-latest
    needs: keepalive
    steps:
      - name: Install pg_dump 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 || sudo apt-get install -y -qq postgresql-client
      - name: Dump
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }} # Project Settings > Database > Connection string (URI, session mode)
        run: |
          mkdir -p dump
          pg_dump "$DATABASE_URL" --schema=public --no-owner --no-privileges -Fc -f "dump/public-$(date -u +%F).dump"
          ls -la dump
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-dump-${{ github.run_id }}
          path: dump/
          retention-days: 90
